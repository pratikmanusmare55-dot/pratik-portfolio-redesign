name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild and verify the uploaded transparent hero portrait
        shell: bash
        run: |
          set -euo pipefail
          cat .github/portrait-parts/part_*.txt | tr -d '\n' | base64 --decode > /tmp/pratik-hero-portrait.webp
          test -s /tmp/pratik-hero-portrait.webp
          test "$(stat -c%s /tmp/pratik-hero-portrait.webp)" -eq 50438
          test "$(sha256sum /tmp/pratik-hero-portrait.webp | cut -d' ' -f1)" = "23069c87b417f804da7c58a6d3ef494acaab22047d54f318b9224eb79d530f3e"
          test "$(head -c 4 /tmp/pratik-hero-portrait.webp | od -An -tx1 | tr -d ' \n')" = "52494646"
          test "$(dd if=/tmp/pratik-hero-portrait.webp bs=1 skip=8 count=4 status=none)" = "WEBP"
          install -m 644 /tmp/pratik-hero-portrait.webp assets/pratik-hero-portrait.webp
          rm -rf .github/portrait-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pratik-hero-portrait.webp .github/portrait-parts
          git commit -m "Replace hero portrait with uploaded transparent image"
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
